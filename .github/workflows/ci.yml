name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    lint-and-test:
        # WPF のプロジェクトは Windows でしかビルドできない。
        # 共通の検査も .NET の整形を含むため、同じジョブで実行する
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # global.json が指定する SDK を導入する
            - name: Setup .NET
              uses: actions/setup-dotnet@v6

            - name: Setup uv
              # v8 以降はメジャー版のタグがないため、リリースの版を指定する
              uses: astral-sh/setup-uv@v10.2.0

            # 設定変更で既存ファイルが違反になった場合も検出するため、全ファイルへ掛ける。
            # pre-push ステージのフックは対象外のため、ビルドとテストは後続の手順で実行する
            - name: Run pre-commit hooks
              run: uvx pre-commit run --all-files --show-diff-on-failure

            - name: Build
              run: dotnet build CaptionWeave.slnx

            - name: Test
              run: dotnet test CaptionWeave.slnx --no-build
